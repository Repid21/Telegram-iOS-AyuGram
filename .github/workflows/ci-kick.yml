name: Kick Ayu v0.3 Verify

on:
  workflow_dispatch:
  pull_request:
    types: [opened]
  schedule:
    - cron: '47,52,57,2,7,12,17,22,27,32,37,42 * * * *'

permissions:
  actions: write
  issues: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Verify Ayu v0.3
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `🟦 CI kick alive. run=${context.runId}, event=${context.eventName} — dispatching Verify Ayu v0.3.`
            });
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'verify-patch.yml',
              ref: 'main'
            });
