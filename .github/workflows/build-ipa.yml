name: Build Telegram Ayu Edit History IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'payload/**'
      - 'apply_ayu_*.py'
      - 'ci_verify_v03.py'
      - 'telegram-ref.txt'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

concurrency:
  group: telegram-ayu-edit-history-ipa
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify edit-history patch
        run: python3 ci_verify_v03.py

  build:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Checkout pinned Telegram source
        id: telegram-source
        shell: bash
        run: |
          set -euo pipefail
          REF="$(tr -d '[:space:]' < telegram-ref.txt)"
          test -n "$REF" || { echo 'telegram-ref.txt is empty'; exit 1; }
          cd "$RUNNER_TEMP"
          rm -rf Telegram-iOS
          git init Telegram-iOS
          cd Telegram-iOS
          git remote add origin https://github.com/TelegramMessenger/Telegram-iOS.git
          git fetch --depth 1 origin "$REF"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 8
          ACTUAL_REF="$(git rev-parse HEAD)"
          test "$ACTUAL_REF" = "$REF" || { echo "Pinned Telegram ref mismatch: $ACTUAL_REF != $REF"; exit 1; }
          echo "Telegram ref: $ACTUAL_REF"
          echo "ref=$ACTUAL_REF" >> "$GITHUB_OUTPUT"

      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: telegram-ios-edit-history-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-${{ github.run_id }}
          restore-keys: |
            telegram-ios-edit-history-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-
            telegram-ios-bazel-v030-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-

      - name: Apply Ayu patches
        run: |
          python3 "$GITHUB_WORKSPACE/apply_ayu_v03_crashfix.py" "$RUNNER_TEMP/Telegram-iOS"
          python3 "$GITHUB_WORKSPACE/apply_ayu_profile_cache.py" "$RUNNER_TEMP/Telegram-iOS"
          python3 "$GITHUB_WORKSPACE/apply_ayu_unlimited_pins.py" "$RUNNER_TEMP/Telegram-iOS"
          python3 "$GITHUB_WORKSPACE/apply_ayu_ads.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Create build configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          cat > build-system/ayu-ci-configuration.json <<'EOF'
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "8",
            "api_hash": "7245de8e747a0d6fbe11f7cc14fcc0bb",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF
          python3 -m json.tool build-system/ayu-ci-configuration.json >/dev/null

      - name: Import fake signing certificates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          security find-identity -v -p codesigning || true

      - name: Build release arm64
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          mkdir -p "$RUNNER_TEMP/output"
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/ayu-ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber="$GITHUB_RUN_NUMBER" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$RUNNER_TEMP/output"

      - name: Prepare IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/output/Telegram.ipa"
          test -f "$IPA" || { find "$RUNNER_TEMP/output" -type f -print; exit 1; }
          mv "$IPA" "$RUNNER_TEMP/output/AyuGram-EditHistory.ipa"
          echo "path=$RUNNER_TEMP/output/AyuGram-EditHistory.ipa" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/output/AyuGram-EditHistory.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-EditHistory-IPA
          path: ${{ steps.ipa.outputs.path }}
          compression-level: 0
          if-no-files-found: error

      - name: Save Bazel disk cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: telegram-ios-edit-history-macos26-xcode262-${{ steps.telegram-source.outputs.ref }}-${{ github.run_id }}
