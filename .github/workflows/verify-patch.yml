name: Verify Ayu Patch v0.3

on:
  workflow_dispatch:
  push:
    paths:
      - 'apply_ayu_v03.py'
      - 'payload/**'
      - 'telegram-ref.txt'
      - '.github/workflows/verify-patch.yml'

concurrency:
  group: ayu-v03-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: python3 -m py_compile apply_ayu_v03.py

      - name: Checkout pinned Telegram source
        shell: bash
        run: |
          set -euo pipefail
          REF="$(tr -d '[:space:]' < telegram-ref.txt)"
          test -n "$REF" || { echo 'telegram-ref.txt is empty'; exit 1; }
          cd "$RUNNER_TEMP"
          git init Telegram-iOS
          cd Telegram-iOS
          git remote add origin https://github.com/TelegramMessenger/Telegram-iOS.git
          git fetch --depth 1 origin "$REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$REF" || { echo 'Pinned Telegram ref mismatch'; exit 1; }
          echo "Telegram ref: $REF"

      - name: Apply Ayu v0.3
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/apply_ayu_v03.py" "$RUNNER_TEMP/Telegram-iOS"

      - name: Verify native settings structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/Telegram-iOS" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          settings = (root / "submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoSettingsItems.swift").read_text(encoding="utf-8")
          ayu_controller = root / "submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/AyuSettingsController.swift"
          ghost_last_seen = root / "submodules/TelegramCore/Sources/State/AyuGhostLastSeen.swift"
          debug = (root / "submodules/DebugSettingsUI/Sources/DebugController.swift").read_text(encoding="utf-8")

          marker = 'text: "AyuGram"'
          assert settings.count(marker) == 1, "AyuGram settings row missing or duplicated"
          photo = 'items[.edit]!.append(PeerInfoScreenActionItem(id: 2,'
          username = 'if let peer = data.peer, (peer.addressName ?? "").isEmpty {'
          assert settings.index(photo) < settings.index(marker) < settings.index(username), "AyuGram row is not below profile photo"
          assert ayu_controller.exists(), "AyuSettingsController.swift missing"
          assert ghost_last_seen.exists(), "AyuGhostLastSeen.swift missing"
          assert 'AyuGram Settings' not in debug, "legacy DebugController Ayu row should not be patched in v0.3"
          print("✅ native settings structure OK")
          PY

      - name: Verify deleted-message guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/Telegram-iOS/submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift" <<'PY'
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          assert text.count("AyuRuntimeSettings.markDeletedGlobalIds") >= 2, "global deleted-message hooks missing"
          assert text.count("AyuRuntimeSettings.markDeletedMessageIds") >= 2, "channel deleted-message hooks missing"
          assert "AyuRuntimeSettings.keepDeletedMessages" in text, "deleted preservation guard missing"
          print("✅ deleted-message hooks OK")
          PY

      - name: Verify markers
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Telegram-iOS"
          grep -q 'AYU_IOS_PATCH_v0_3' submodules/TelegramCore/Sources/State/ManagedAccountPresence.swift
          grep -q 'AYU_IOS_PATCH_v0_3' submodules/TelegramCore/Sources/State/ManagedLocalInputActivities.swift
          grep -q 'AYU_IOS_PATCH_v0_3' submodules/TelegramCore/Sources/State/SynchronizePeerReadState.swift
          grep -q 'AYU_IOS_PATCH_v0_3' submodules/TelegramCore/Sources/State/ManagedSynchronizeViewStoriesOperations.swift
          grep -q 'AYU_IOS_PATCH_v0_3' submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift
          grep -q 'AYU_IOS_PATCH_v0_3' submodules/TelegramCore/Sources/PendingMessages/EnqueueMessage.swift
          grep -q 'AYU_IOS_PATCH_v0_3' submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode/Sources/StringForMessageTimestampStatus.swift
          grep -q 'AYU_IOS_PATCH_v0_3' submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode/Sources/ChatMessageDateAndStatusNode.swift
          grep -q 'AYU_IOS_PATCH_v0_3' submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoSettingsItems.swift
          grep -q 'AYU_IOS_PATCH_v0_3' submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoData.swift
          grep -q 'func ayuSettingsController(context: AccountContext)' submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/AyuSettingsController.swift
          grep -q 'public enum AyuGhostLastSeen' submodules/TelegramCore/Sources/State/AyuGhostLastSeen.swift
          echo '✅ v0.3 patch anchors OK'
